server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp ngầm mọi request /api/ sang Backend Service trên Render
    location /api/ {
        proxy_pass https://mern-backend-1-0-eazo.onrender.com/api/;

        # BẮT BUỘC: Cấu hình SNI & Host header để Render chấp nhận request SSL
        proxy_set_header Host mern-backend-1-0-eazo.onrender.com;
        proxy_ssl_server_name on;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}